# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 26.2 ships its classes under Mojang's own names: there is no obfuscation left to
# remap and no mapping set (Yarn/Intermediary/Mojmap) in the toolchain any more. Yarn stopped
# publishing after 1.21.11, and Fabric's intermediary for 26.2 is the identity mapping. Loom
# therefore resolves the vanilla jar as-is, and both the mod's own classes and every Minecraft
# reference keep their real names at runtime, which is why no `mappings` dependency is declared.
fabric.loom.disableObfuscation=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.153.0+26.2

# Mod Properties
mod_version=2.6.1
maven_group=mchorse
archives_base_name=bbs
